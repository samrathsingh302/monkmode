# Default block lengths when you run a command without one (e.g. just `mm-reddit`).
# EDIT THESE FREELY. Formats: 45 (= minutes), 90m, 2h, 1d2h30m, or midnight.
# midnight = until the NEXT 23:59: today's, or TOMORROW's if today's has already passed or is
# too close to arm (under ~2 minutes) - a block must end over a minute out or the CLI refuses it.
# Remember: once armed, a block can NEVER be cut short - only grown.
video=midnight
insta=2h
reddit=2h
