name: CI

on:
  push:
    branches: [monkmode]
  pull_request:
    branches: [monkmode]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build MonkMode.sln -c Release

      # Pure unit tests only — strings and temp paths. Nothing here touches the
      # runner's hosts file, registry or Service Control Manager.
      - name: Test
        run: dotnet test MonkMode.sln -c Release --no-build --verbosity normal
